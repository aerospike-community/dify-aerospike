name: CLI Tests

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: cli-tests-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: CLI Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [depot-ubuntu-24.04, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
        working-directory: ./cli

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup web environment
        uses: ./.github/actions/setup-web

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Test development proxy file watching
        timeout-minutes: 5
        working-directory: ./packages/dev-proxy
        run: pnpm test --run --maxWorkers=1

      - name: Validate release manifest
        if: matrix.os == 'depot-ubuntu-24.04'
        run: node scripts/release-naming.mjs validate

      - name: CI pipeline (tree, coverage, build)
        run: pnpm run ci

      - name: Report coverage
        if: matrix.os == 'depot-ubuntu-24.04'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: cli/coverage/coverage-final.json
          disable_search: true
          fail_ci_if_error: true
          flags: cli
          name: cli-linux
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
